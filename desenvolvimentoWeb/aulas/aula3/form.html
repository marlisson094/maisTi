    <h1> Meu primeiro formulário</h1>
    <form action="index.html" target="_blank">

        <br>

        <input type="checkbox" name="time" value="outro">Outro
        
        <br>

	    </select>

        <br>

        <br>
        <br>

        <br>

        <br>
        <br>
        <input type="submit" value="Enviar"> <input type="reset" value="Resetar">
        

    </form>

    <form>
